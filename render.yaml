services:
  - type: web
    name: chennai-flood-api
    runtime: python
    rootDir: flood_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
